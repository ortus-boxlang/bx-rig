# BxRig Colour-blind Safe: blue and orange instead of red and green (Okabe-Ito hues), on a dark slate. Every text colour is at
# least 7:1 on the background (WCAG AAA). "red" is a vermilion and "green" a bluish green, so the two differ in lightness too.
mode = "dark"

accent = "#56b4e9"
selection = "#2c3344"
muted = "#b8bcc8"

background = "#14171f"
dark_background = "#0f1218"
darker_background = "#0a0c11"
lighter_background = "#222733"

foreground = "#f2f2f2"
dark_foreground = "#b8bcc8"
light_foreground = "#d8dbe3"
bright_foreground = "#ffffff"

red = "#ff8a50"
yellow = "#f0e442"
orange = "#e69f00"
green = "#3fd9b0"
cyan = "#7fd8ff"
blue = "#6cc0f2"
magenta = "#e89acb"
brown = "#c08a5a"

bright_red = "#ffab80"
bright_yellow = "#f6ee8a"
bright_green = "#7fe8cb"
bright_cyan = "#a8e5ff"
bright_blue = "#9ad3f6"
bright_magenta = "#f1bfdd"
