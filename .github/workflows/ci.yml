name: BxRig CI
on:
  push:
    branches: [development]
    tags: ['v*']
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bxrig-ci-global
  cancel-in-progress: true
# The tests describe Arch: the catalog and the package manager follow BXRIG_DISTRO, not the Ubuntu runner (a distribution job sets its own).
env:
  BXRIG_DISTRO: arch
jobs:
  validate:
    name: 1 - Validate source and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and CLI contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/paths-test.sh tests/lib/harness.sh tests/run-all.sh tests/dry-test.sh bootstrap/install.sh scripts/package-manager.sh tests/package-manager-test.sh tests/bootstrap-test.sh tests/native-smoke.sh tests/native-package-integration.sh scripts/config.sh tests/config-test.sh tests/config-native-test.sh tests/cli-contract-test.sh tests/catalog-test.sh tests/packages-test.sh tests/setup-test.sh tests/tiling-test.sh tests/keys-test.sh tests/keys-apply-test.sh tests/xremap-test.sh tests/assets-test.sh tests/wallpaper-packs-test.sh tests/launcher-search-test.sh tests/noctalia-config-test.sh tests/hyprland-setup-test.sh tests/session-test.sh tests/shell-setup-test.sh tests/terminal-setup-test.sh tests/wizard-test.sh tests/look-pages-test.sh tests/init-test.sh tests/toolchain-test.sh tests/runner-test.sh tests/db-test.sh tests/dotfiles-test.sh tests/default-test.sh tests/secrets-test.sh tests/ai-test.sh tests/ai-shell-test.sh tests/ai-session-test.sh tests/ai-local-test.sh tests/ai-agents-test.sh tests/mcp-test.sh tests/privacy-test.sh tests/android-test.sh tests/boxy-test.sh tests/install-screen-test.sh tests/ssh-keyboard-test.sh tests/menu-test.sh tests/containers-test.sh tests/doctor-test.sh tests/git-signing-test.sh tests/servers-test.sh tests/scheduler-test.sh tests/calendar-test.sh tests/launcher-test.sh tests/utilities-test.sh tests/keys-editor-test.sh tests/web-vpn-test.sh tests/vpn-test.sh tests/runtime-cloud-test.sh tests/apps-test.sh tests/status-test.sh tests/strata-test.sh tests/extras-test.sh tests/capture-notify-test.sh tests/plasma-panels-test.sh tests/boxlang-test.sh tests/macextras-test.sh tests/input-test.sh tests/update-test.sh tests/skills-test.sh tests/theme-test.sh tests/editor-test.sh tests/vm-test.sh tests/pkg-test.sh tests/system-actions-test.sh tests/appearance-test.sh tests/display-test.sh tests/power-test.sh tests/time-test.sh tests/tweaks-test.sh tests/accessibility-test.sh tests/security-test.sh tests/help-test.sh tests/nas-test.sh tests/refresh-test.sh tests/backup-config-test.sh tests/backup-snapshots-test.sh tests/backup-data-test.sh tests/backup-move-test.sh tests/system-updates-test.sh tests/backup-status-test.sh tests/timeline-test.sh tests/tui-test.sh tests/apps-manager-test.sh tests/launchers-test.sh tests/icon-theme-assets-test.sh tests/icon-set-test.sh tests/java-test.sh tests/sdk-test.sh tests/mail-test.sh tests/command-spec-test.sh tests/version-test.sh tests/ascii-test.sh tests/about-test.sh tests/screensaver-test.sh tests/repo-hygiene-test.sh tests/boot-test.sh scripts/format.sh bootstrap/gen-version.sh bootstrap/gen-docs.sh bootstrap/web-install.sh tests/web-install-test.sh scripts/gen-signing-key.sh bootstrap/gen-assets.sh scripts/get-matchbox.sh scripts/get-modules.sh scripts/dev-build.sh scripts/setup-local.sh tests/arch/cachyos-repos.sh tests/arch/run.sh tests/arch/suite.sh tests/setup-local-test.sh scripts/lib/matchbox-ref.sh
          test -s src/Main.bx -a -s src/Application.bx
          jq -e . catalog/apps.json >/dev/null
          bash scripts/format.sh --check   # tabs for indentation, LF, one final newline, no trailing spaces (.editorconfig)
          bash bootstrap/gen-assets.sh --check
          bash bootstrap/gen-version.sh --check
          jq -e . box.json >/dev/null   # the manifest must be valid JSON
          for command in version doctor prerequisites desktop-list tui-list web-list optional-list optional-plan profile-list profile-plan plan apps-doctor dev-plan help; do
            grep -Fq "\"$command\"" src/Main.bx
          done
  package-tests:
    name: 2 - Mocked package-manager tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/package-manager-test.sh
      - run: bash tests/dry-test.sh
      - run: bash tests/bootstrap-test.sh
      - run: bash tests/web-install-test.sh
      - run: bash tests/config-test.sh
      - run: bash tests/setup-local-test.sh
  arch:
    name: 3 - Arch Linux prerequisites
    needs: package-tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install and verify toolchains
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed jdk21-openjdk git curl unzip rustup bash
          java -version
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version
      - uses: actions/checkout@v4
      - run: bash -n bootstrap/install.sh
  toolchain:
    name: 3b - MatchBox from the bxrig branch
    needs: package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: matchbox-cargo-${{ runner.os }}-${{ hashFiles('box.json') }}
          restore-keys: matchbox-cargo-${{ runner.os }}-
      - name: Get MatchBox (published build, else built from source)
        run: |
          set -euo pipefail
          scripts/get-matchbox.sh matchbox-out/matchbox-linux-x86_64
          cat matchbox-out/matchbox-linux-x86_64.info
      - uses: actions/upload-artifact@v4
        with:
          name: matchbox-linux-x86_64
          path: matchbox-out/matchbox-linux-x86_64
          if-no-files-found: error
  native:
    name: 4 - Compile BxRig and native tests
    needs: [arch, toolchain]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: matchbox-linux-x86_64
          path: matchbox-out
      - name: Compile with MatchBox
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 755 matchbox-out/matchbox-linux-x86_64 "$HOME/.local/bin/matchbox"
          export PATH="$HOME/.local/bin:$PATH"
          matchbox --version
          matchbox --version | grep -F "$(jq -r .toolchain.matchbox.version box.json)"
          mkdir -p dist
          # the BoxLang modules bxrig embeds (box.json toolchain.modules); --module must come before the program.
          # Native plugins are rebuilt in Debian 12 (glibc 2.36): the runner's glibc is newer than Debian 13's, so a plugin linked here would not load there
          modlist="$(BXRIG_PLUGIN_IMAGE=rust:1-bookworm scripts/get-modules.sh .cache/modules)"
          mods=(); while IFS= read -r m; do [[ -n "$m" ]] && mods+=( --module "$m" ); done <<<"$modlist"
          matchbox "${mods[@]}" --target native --output dist/bxrig src/Main.bx
      - name: Run smoke tests on compiled executable
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(realpath dist/bxrig)"
          bash tests/native-smoke.sh "$candidate"
          bash -x tests/native-package-integration.sh "$candidate"
          bash tests/config-native-test.sh "$candidate"
          bash tests/cli-contract-test.sh "$candidate"
          bash tests/version-test.sh "$candidate"
          bash tests/ascii-test.sh "$candidate"
          bash tests/about-test.sh "$candidate"
          bash tests/screensaver-test.sh "$candidate"
          bash tests/repo-hygiene-test.sh "$candidate"
          bash tests/catalog-test.sh "$candidate"
          bash tests/packages-test.sh "$candidate"
          bash tests/setup-test.sh "$candidate"
          bash tests/tiling-test.sh "$candidate"
          bash tests/keys-test.sh "$candidate"
          bash tests/keys-apply-test.sh "$candidate"
          bash tests/xremap-test.sh "$candidate"
          bash tests/assets-test.sh "$candidate"
          bash tests/wallpaper-packs-test.sh "$candidate"
          bash tests/launcher-search-test.sh "$candidate"
          bash tests/noctalia-config-test.sh "$candidate"
          bash tests/hyprland-setup-test.sh "$candidate"
          bash tests/session-test.sh "$candidate"
          bash tests/shell-setup-test.sh "$candidate"
          bash tests/terminal-setup-test.sh "$candidate"
          (cd src && matchbox ../tests/resolver_test.bxs)
          (cd src && matchbox ../tests/installer_test.bxs)
          (cd src && matchbox ../tests/setup_plan_test.bxs)
          (cd src && matchbox ../tests/shortcuts_test.bxs)
          (cd src && matchbox ../tests/keystyle_test.bxs)
          (cd src && matchbox ../tests/shortcuts_runner_test.bxs)
          (cd src && matchbox ../tests/launchers_programs_test.bxs)
