          (cd src && matchbox ../tests/noctalia_config_test.bxs)
          (cd src && matchbox ../tests/dev_plugin_test.bxs)
          (cd src && matchbox ../tests/bar_settings_test.bxs)
          (cd src && matchbox ../tests/plugin_quick_power_test.bxs)
          (cd src && matchbox ../tests/catalog_check.bxs)
