      - name: Publish verified native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bxrig-linux-native
          path: dist/bxrig
          if-no-files-found: error
  arch-real:
    name: 5 - Real Arch system tests (container, non-root, real pacman)
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: matchbox-linux-x86_64
          path: matchbox-out
      - name: Run real-system suite
        shell: bash
        run: |
          set -o pipefail
          chmod +x matchbox-out/matchbox-linux-x86_64
          BXRIG_MATCHBOX_FILE="$PWD/matchbox-out/matchbox-linux-x86_64" bash tests/arch/run.sh "$PWD/arch-test-out" 2>&1 | tee arch-run.txt
      - name: Result table
        if: always()
        shell: bash
        run: |
          {
            echo '### Real Arch system tests'
            echo '| Result | Step | Detail |'
            echo '| --- | --- | --- |'
            [[ -f arch-test-out/results.tsv ]] && awk -F'\t' '{printf "| %s | %s | %s %s %s |\n",$1,$2,$3,$4,$5}' arch-test-out/results.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-real-logs
          path: |
            arch-test-out/
            arch-run.txt
          if-no-files-found: warn
  distros:
    name: 5 - Other distributions (catalog, setup plan)
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [ "opensuse/tumbleweed", "debian:trixie", "ubuntu:26.04" ]
    container:
      image: ${{ matrix.image }}
    env:
      BXRIG_DISTRO: ""
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bxrig-linux-native
          path: dist
      - name: Catalog and setup plan on this distribution
        shell: bash
        run: |
          set -euo pipefail
          install -m 755 dist/bxrig /usr/local/bin/bxrig
          bxrig catalog check
          bxrig catalog coverage
          # the catalog reads this distribution: git comes from its own package manager
          bxrig catalog show git --json | grep -Eq '"source":"(zypper|apt)"'
          # setup refuses root and needs sudo: plan it as a normal user
          if command -v zypper >/dev/null; then zypper --non-interactive install sudo; else apt-get update -qq && apt-get install -y -qq sudo; fi
          useradd -m tester
          su tester -c "bxrig setup hyprland --dry-run"
  publish:
    name: 6 - Publish BxRig to S3 (beta from development, stable from a v* tag)
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v'))
    needs: [native, arch-real]
    runs-on: ubuntu-latest
    env:
      HAS_S3: ${{ secrets.AWS_ACCESS_KEY != '' && secrets.AWS_ACCESS_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bxrig-linux-native
          path: dist
      - name: Lay out the S3 folders (channels stable and beta, snapshots, the one-line installer)
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then CHANNEL=stable; VERSION="${GITHUB_REF_NAME#v}"; else CHANNEL=beta; VERSION="$(jq -r .version box.json)"; fi
          sum="$(sha256sum dist/bxrig | awk '{print $1}')"
          bash -n bootstrap/web-install.sh
          tar -czf bootstrap.tar.gz bootstrap/install.sh box.json assets/wallpapers/*.jpg
          bsum="$(sha256sum bootstrap.tar.gz | awk '{print $1}')"
          layout() {
            mkdir -p "$1"
            cp dist/bxrig "$1/bxrig-linux-x86_64"; echo "${sum}  bxrig-linux-x86_64" > "$1/bxrig-linux-x86_64.sha256"
            cp bootstrap.tar.gz "$1/bootstrap.tar.gz"; echo "${bsum}  bootstrap.tar.gz" > "$1/bootstrap.tar.gz.sha256"
            printf 'version=%s\ncommit=%s\nsha256=%s\nbootstrap_sha256=%s\nchannel=%s\nbuiltAt=%s\n' "$VERSION" "${GITHUB_SHA::7}" "$sum" "$bsum" "$CHANNEL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$1/version-latest.properties"
          }
          layout "build/s3/$CHANNEL"
          if [[ "$CHANNEL" == beta ]]; then layout "build/s3/snapshots/${VERSION}-${GITHUB_SHA::7}"; else layout "build/s3/releases/${VERSION}"; fi
          cp bootstrap/web-install.sh build/s3/install.sh
          # the theme wallpapers, shared by every channel: bxrig fetches a missing one and checks it against the SHA-256 it carries
          mkdir -p build/s3/wallpapers && cp assets/wallpapers/*.jpg build/s3/wallpapers/
          echo "channel=$CHANNEL version=$VERSION"
      - name: Sign the release (Ed25519; the key is the secret BXRIG_SIGNING_KEY, the public key is keys/release.pub)
        env:
          SIGNING_KEY: ${{ secrets.BXRIG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY:-}" || ! -f keys/release.pub ]]; then
            echo "::warning::BXRIG_SIGNING_KEY or keys/release.pub is missing: publishing UNSIGNED (clients without a key check SHA-256 only; clients with a key refuse it)"
            exit 0
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          # the public key goes into the published installer, then everything is signed
          sed -i "s|@@PUBKEY_B64@@|$(base64 -w0 keys/release.pub)|" build/s3/install.sh
          for f in $(find build/s3 -name version-latest.properties) build/s3/install.sh; do
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/release.key" -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in "$f" -sigfile "$f.sig"
          done
          rm -f "$RUNNER_TEMP/release.key"
      - name: Upload to S3 (public-read, never deletes older snapshots or releases)
        if: env.HAS_S3 == 'true'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          AWS_S3_BUCKET: "downloads.ortussolutions.com"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
          SOURCE_DIR: "build/s3"
          DEST_DIR: "ortussolutions/bxrig"
